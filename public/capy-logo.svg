<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoCapyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="40%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
  </defs>

  <!-- Group: Icon (Scale to 56x56 at x=4, y=7) -->
  <g transform="translate(6, 4) scale(0.62)">
    <!-- RSS dot -->
    <circle cx="26" cy="74" r="7" fill="url(#logoCapyGrad)" />
    <!-- RSS wave 1 -->
    <path d="M 26 52 A 22 22 0 0 1 48 74" stroke="url(#logoCapyGrad)" stroke-width="7" stroke-linecap="round" />
    <!-- RSS wave 2 -->
    <path d="M 26 34 A 40 40 0 0 1 66 74" stroke="url(#logoCapyGrad)" stroke-width="7" stroke-linecap="round" />
    <!-- Capybara profile -->
    <path d="M 50 36 C 54 28, 62 23, 72 23 C 74 23, 77 24, 78 26 C 80 23, 83 23, 85 25 C 87 27, 86 31, 84 34 C 88 36, 92 41, 92 48 C 92 57, 85 62, 76 62 C 71 62, 67 60, 63 56 L 58 64 C 54 70, 48 74, 42 74" stroke="url(#logoCapyGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 75 40 Q 78 39 81 41" stroke="url(#logoCapyGrad)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="88" cy="48" r="2.2" fill="url(#logoCapyGrad)" />
    <path d="M 87 53 Q 84 56 80 55" stroke="url(#logoCapyGrad)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Typography: Poppins/Inter style -->
  <text x="76" y="47" font-family="Poppins, Inter, system-ui, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5px">Capy<tspan font-weight="300" fill="#A855F7">News</tspan></text>
  
  <!-- Tiny Subtitle Tag -->
  <text x="78" y="61" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#71717A" letter-spacing="1.5px">COGNITIVE EMANCIPATION</text>
</svg>
